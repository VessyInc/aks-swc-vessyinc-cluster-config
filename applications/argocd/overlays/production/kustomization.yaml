apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../../base
  - ingress.yaml

patches:
  - path: patches/argocd-cm.yaml
  - path: patches/argocd-rbac-cm.yaml
  - path: patches/argocd-cmd-params-cm.yaml
  - path: patches/resource-limits.yaml
  - path: patches/argocd-msft-oidc.yaml

  - target: {kind: AppProject, name: platform, namespace: argocd}
    patch: |-
      - op: add
        path: /spec/sourceRepos/-
        value: "https://github.com/VessyInc/aks-swc-vessyinc-cluster-config.git"

  - target: {kind: ApplicationSet, name: platform, namespace: argocd}
    patch: |-
      - op: add
        path: /spec/generators/-
        value:
          git:
            repoURL: "https://github.com/VessyInc/aks-swc-vessyinc-cluster-config.git"
            revision: "main"
            directories:
              - path: "applications/*/overlays/production"
      - op: replace
        path: /spec/template/spec/source/repoURL
        value: "https://github.com/VessyInc/aks-swc-vessyinc-cluster-config.git"
      - op: replace
        path: /spec/template/spec/source/targetRevision
        value: "main"