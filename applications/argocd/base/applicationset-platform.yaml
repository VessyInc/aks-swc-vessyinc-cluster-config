apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  labels:
    # app.kubernetes.io/name: ""
    # app.kubernetes.io/environment: ""
    # app.kubernetes.io/instance: ""
    # app.kubernetes.io/version: ""
    # app.kubernetes.io/component: ""
    app.kubernetes.io/part-of: "platform"
    app.kubernetes.io/managed-by: "ArgoCD"
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators: []
  template:
    metadata:
      labels:
        # app.kubernetes.io/name: ""
        # app.kubernetes.io/environment: ""
        app.kubernetes.io/instance: "0"
        # app.kubernetes.io/version: ""
        # app.kubernetes.io/component: ""
        app.kubernetes.io/part-of: "platform"
        app.kubernetes.io/managed-by: "ArgoCD"
      name: '{{index .path.segments 1}}-{{index .path.segments 3}}'
    spec:
      project: platform
      source:
        repoURL: placeholder
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: "argocd"
      syncPolicy:
        automated:
          prune: true # do not change
          selfHeal: true # do not change
          allowEmpty: true # do not change
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - PruneLast=true