apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  labels:
    app.kubernetes.io/component: "projects"
    app.kubernetes.io/name: "projects"
  name: projects
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators: []
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "projects"
        app.kubernetes.io/environment: ""
        app.kubernetes.io/instance: "1"
        # app.kubernetes.io/version: ""
        app.kubernetes.io/component: "projects"
        app.kubernetes.io/part-of: "bootstrap"
        app.kubernetes.io/managed-by: "ArgoCD"
      name: 'project-{{index .path.segments 1}}-{{index .path.segments 2}}'
    spec:
      project: platform
      source:
        repoURL: placeholder
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        # namespace: ""
      syncPolicy:
        automated:
          prune: true # do not change
          selfHeal: true # do not change
          allowEmpty: true # do not change
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - PruneLast=true