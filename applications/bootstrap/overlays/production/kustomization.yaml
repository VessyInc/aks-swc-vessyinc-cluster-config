apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

nameSuffix: -production

patches:

  - target: {kind: ApplicationSet, name: projects}
    patch: |-
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1environment
        value: "production"
      - op: add
        path: /spec/generators/-
        value:
          git:
            repoURL: "https://github.com/VessyInc/aks-swc-vessyinc-cluster-config.git"
            revision: "main"
            directories: 
              - path: "projects/*/production"
      - op: replace
        path: /spec/template/spec/source/repoURL
        value: "https://github.com/VessyInc/aks-swc-vessyinc-cluster-config.git"
      - op: replace
        path: /spec/template/spec/source/targetRevision
        value: "main"