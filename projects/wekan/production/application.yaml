apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/name: "wekan"
    app.kubernetes.io/environment: "production"
    app.kubernetes.io/instance: "1"
    app.kubernetes.io/component: "wekan"
    app.kubernetes.io/part-of: "wekan"
    app.kubernetes.io/managed-by: "ArgoCD"
  name: wekan-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: wekan
  source:
    repoURL: "https://github.com/VessyInc/wekan.git"
    targetRevision: main
    path: "overlays/production"
  destination:
    server: https://kubernetes.default.svc
    namespace: "wekan"
  syncPolicy:
    automated:
      prune: true # do not change
      selfHeal: true # do not change
      allowEmpty: true # do not change
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
