apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy-kubernetes-ingress
  namespace: haproxy-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      run: haproxy-ingress
  template:
    spec:
      containers:
        - name: haproxy-ingress
          resources:
            limits:
              cpu: 500m
              memory: 2056Mi
            requests:
              cpu: 250m
              memory: 1028Mi
